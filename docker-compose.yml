services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      APP_URL: ${APP_URL:-}
      APP_DEBUG: ${APP_DEBUG:-0}
      # AI School demo: "mock" (default, rule-based) or "openai"
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    restart: unless-stopped
